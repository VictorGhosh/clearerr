<!DOCTYPE html>
<html>
<head>
    <title>Clearerr</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-base-200 flex justify-center items-center min-h-screen">
    <div class="card bg-base-100 shadow w-96">
        <figure>
            {% if item.poster_url %}
            <img src="{{ item.poster_url }}" />
            {% else %}
            <div class="aspect-[2/3] w-full bg-base-300"></div>
            {% endif %}
        </figure>
        <div class="card-body items-center text-center">
            <h2 class="card-title">{{ item.title }}</h2>
            <p class="text-base-content/70">
                {% if item.exempted_at %}
                Remove <strong>{{ item.title }}</strong> from the exempt list?
                {% else %}
                Add <strong>{{ item.title }}</strong> to the exempt list?
                {% endif %}
            </p>
            <div class="flex gap-4 mt-4">
                <a href="/" class="btn btn-ghost">Cancel</a>
                <form method="post" action="/exempt/toggle/{{ item.rating_key }}">
                    <button type="submit" class="btn btn-success">Confirm</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
