<!DOCTYPE html>
<html>
<head>
    <title>Clearerr</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body class="p-8 bg-base-200">
    <h1 class="text-3xl font-bold mb-6">Media Library</h1>

    <div class="flex gap-4 mb-6">
        <input type="text" placeholder="Search..." 
            class="input input-bordered flex-1"
            hx-get="/search"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#media-grid"
            hx-include="#sort-select"
            name="q">

        <select id="sort-select" name="sort" class="select select-bordered"
            hx-get="/search"
            hx-trigger="change"
            hx-target="#media-grid"
            hx-include="input[name='q']">
            <option value="title">Sort by: Title</option>
            <option value="deletion_score">Sort by: Likelihood of Removal</option>
        </select>
    </div>

    <form method="post" action="/exempt/update">
        <div id="media-grid">
            {% include "partials/media_grid.html" %}
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-base-100 shadow-lg flex justify-end">
            <button type="submit" class="btn btn-primary">Save Exempt List</button>
        </div>
    </form>


</body>
</html>
