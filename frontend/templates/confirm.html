<!DOCTYPE html>
<html>
<head>
    <title>Clearerr</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body class="p-8 bg-base-200">
    <h1 class="text-3xl font-bold mb-6">Changes Saved</h1>

    <div id="media-grid">
        <div class="collapse collapse-arrow bg-base-100 shadow mb-6">
            <input type="checkbox" checked />
            <div class="collapse-title text-xl font-bold">Added to Exempt</div>
            <div class="collapse-content">
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pt-4">
                    {% for item in added %}
                    <div class="card bg-base-200 shadow media-card" data-title="{{ item.title }}">
                        <figure><img src="{{ item.poster_url }}" /></figure>
                        <div class="card-body">
                            <div class="flex justify-between items-center">
                                <h2 class="card-title">{{ item.title }}</h2>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    <p class="text-base-content/50 pt-2">Nothing added.</p>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="collapse collapse-arrow bg-base-100 shadow mb-6">
            <input type="checkbox" checked />
            <div class="collapse-title text-xl font-bold">Removed from Exempt</div>
            <div class="collapse-content">
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pt-4">
                    {% for item in removed %}
                    <div class="card bg-base-200 shadow media-card" data-title="{{ item.title }}">
                        <figure><img src="{{ item.poster_url }}" /></figure>
                        <div class="card-body">
                            <div class="flex justify-between items-center">
                                <h2 class="card-title">{{ item.title }}</h2>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    <p class="text-base-content/50 pt-2">Nothing removed.</p>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-base-100 shadow-lg flex justify-end">
        <a href="/" class="btn btn-primary">Back to Library</a>
    </div>

</body>
</html>
